name: Build APK

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # Android SDK sudah terpasang di runner ubuntu-latest.
      # Proyek ini tidak memakai gradle wrapper, jadi Gradle dipasang di sini.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk SimpleLauncher-${{ github.ref_name }}-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SimpleLauncher-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            "SimpleLauncher-${{ github.ref_name }}-debug.apk" \
            --title "Simple Launcher ${{ github.ref_name }} (debug)" \
            --notes "APK debug pertama. Pasang di HP, lalu tekan Home dan pilih Simple Launcher sebagai launcher default."
