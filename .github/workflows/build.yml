name: Build APK

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Isi (mis. v1.2) untuk membuat rilis bertanda tangan (APK + AAB Play Store)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.13
      - name: Build debug APK
        run: gradle assembleDebug --stacktrace
      - name: Verify release build (unsigned, termasuk R8)
        run: gradle bundleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: SimpleLauncher-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  release:
    # Hanya jalan untuk tag v* atau saat release_tag diisi
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.release_tag != ''
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.release_tag || github.ref_name }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.13

      - name: Decode keystore
        run: |
          if [ -z "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "::error::Secret KEYSTORE_BASE64 belum diisi (Settings > Secrets and variables > Actions)."; exit 1
          fi
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build signed AAB and APK
        run: |
          export VERSION_NAME="${TAG#v}"
          export VERSION_CODE="${{ github.run_number }}"
          gradle bundleRelease assembleRelease --stacktrace

      - name: Collect files
        run: |
          mkdir out
          cp app/build/outputs/bundle/release/app-release.aab "out/SimpleLauncher-${TAG}.aab"
          cp app/build/outputs/apk/release/app-release.apk "out/SimpleLauncher-${TAG}-release.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: SimpleLauncher-release
          path: out/*
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" out/* \
            --target "${{ github.sha }}" \
            --title "Simple Launcher $TAG" \
            --notes "Rilis bertanda tangan. File .aab untuk diunggah ke Play Console; file .apk untuk dipasang langsung di HP."
